<!doctype html>
<!-- O painel vive numa TV: tema escuro fixo, sem alternancia. -->
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Fechamento Contábil · LaraFy</title>
<link rel="stylesheet" href="larafy-tokens.css">
<style>
/* ============================================================
   Fechamento contábil — painel de parede.

   Regra que rege esta tela: ela é lida de longe, de relance, por
   quem não vai parar para estudar número. Por isso são poucos
   blocos, cada um grande, e quase nada de texto corrido: o que
   comunica é o tamanho do número, a barra e a curva.

   16:9 sem rolagem, tudo em cqw para escalar do notebook à TV.
   Cores, fontes e medidas saem de larafy-tokens.css.
   ============================================================ */

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; }
body {
  font-family: var(--lf-f-texto); background: var(--lf-navy-esc);
  color: var(--lf-tinta); -webkit-font-smoothing: antialiased;
  display:grid; place-items:center;
}
.palco {
  width: min(100vw, 177.78vh); height: min(56.25vw, 100vh);
  container-type: size; background: var(--lf-fundo);
  display:flex; flex-direction:column; overflow:hidden;
}
.d { font-family: var(--lf-f-mono); font-variant-numeric: tabular-nums; }
.rot { font-size:.82cqw; font-weight:600; color: var(--lf-tinta-2); }
.rot span { font-weight:400; color: var(--lf-tinta-3); }

/* ------------------------------------------------------- cabeçalho */
.topo { flex:none; background: var(--lf-navy); color:#fff; display:flex;
        align-items:center; gap:1.4cqw; padding:0 1.8cqw; height:4.6cqw; }
.logo { height:2cqw; width:auto; display:block; }
.topo h1 { font-family: var(--lf-f-titulo); font-weight:700; font-size:1.2cqw;
           letter-spacing:-.03em; white-space:nowrap; }
.topo h1 em { font-style:normal; font-weight:400; color:#9dbccc; }
.comp-nav { display:flex; align-items:center; gap:.2cqw; }
.comp-seta { background:transparent; border:0; color:#9dbccc; cursor:pointer;
             font-size:1.05cqw; line-height:1; padding:.25cqw .45cqw; border-radius: var(--lf-r1); }
.comp-seta:hover:not(:disabled) { color:#fff; background: rgba(255,255,255,.1); }
.comp-seta:disabled { opacity:.25; cursor:default; }
.comp-atual { font-family: var(--lf-f-mono); font-size:.86cqw; color:#fff; min-width:4.6cqw;
              text-align:center; border-bottom:2px solid var(--lf-cyan); padding-bottom:.15cqw; }
.fonte { margin-left:auto; display:flex; align-items:center; gap:.6cqw;
         font-size:.74cqw; color:#9dbccc; white-space:nowrap; }
.fonte .pt { width:.44cqw; height:.44cqw; border-radius:50%; background: var(--lf-cyan); flex:none; }
.fonte.velha { color:#ffc9c2; } .fonte.velha .pt { background: var(--lf-erro); }
.btn-tv { background:transparent; border:1px solid rgba(255,255,255,.24); color:#9dbccc;
          font-family: var(--lf-f-texto); font-size:.72cqw; border-radius: var(--lf-r2);
          padding:.28cqw .65cqw; cursor:pointer; }
.btn-tv:hover { color:#fff; border-color:#fff; }
:focus-visible { outline:2px solid var(--lf-cyan); outline-offset:2px; }
.palco.sem-ponteiro, .palco.sem-ponteiro * { cursor:none; }

/* --------------------------------------------------------- estrutura */
.corpo { flex:1; min-height:0; display:grid; grid-template-columns:30cqw 1fr;
         grid-template-rows:1fr auto; }
.bloco { padding:1.5cqw 1.9cqw; min-height:0; display:flex; flex-direction:column; }
.bl-num { border-right:1px solid var(--lf-fio); }
.bl-curva { min-width:0; }
.rodape-blocos { grid-column:1 / -1; border-top:1px solid var(--lf-fio);
                 display:grid; grid-template-columns:30cqw 1fr; }

/* ------------------------------------------------- o número principal */
.gigante { font-family: var(--lf-f-titulo); font-weight:800; font-size:8.2cqw;
           line-height:.8; letter-spacing:-.05em; font-variant-numeric: tabular-nums; }
.sub { font-size:1.05cqw; color: var(--lf-tinta-2); margin-top:.9cqw; }
.sub b { font-family: var(--lf-f-mono); color: var(--lf-tinta); font-weight:500; }

.barrona { height:1.1cqw; background: var(--lf-serie-trilho); border-radius: var(--lf-r2);
           display:flex; overflow:hidden; margin-top:1.1cqw; }
.barrona i { display:block; height:100%; }
.barrona i + i { border-left:2px solid var(--lf-fundo); }

.tres { display:grid; grid-template-columns:repeat(3,1fr); gap:1cqw; margin-top:1.5cqw; }
.tres .v { font-family: var(--lf-f-titulo); font-weight:700; font-size:2.6cqw;
           line-height:1; letter-spacing:-.035em; font-variant-numeric: tabular-nums; }
.tres .k { font-size:.76cqw; color: var(--lf-tinta-3); margin-top:.35cqw; }
.c-ok { color: var(--lf-ok); } .c-at { color: var(--lf-atencao); } .c-er { color: var(--lf-erro); }

/* ritmo: duas barras comparáveis, não texto */
.ritmo { margin-top:auto; padding-top:1.3cqw; border-top:1px solid var(--lf-fio); }
.rit-linha { display:grid; grid-template-columns:4.6cqw 1fr; gap:.8cqw;
             align-items:center; margin-top:.7cqw; }
.rit-linha .n { font-family: var(--lf-f-mono); font-size:1.5cqw; font-weight:500;
                text-align:right; line-height:1; }
.rit-linha .bar { height:.85cqw; border-radius: var(--lf-r1); }
.rit-linha .leg { grid-column:2; font-size:.74cqw; color: var(--lf-tinta-3); margin-top:-.15cqw; }

/* ------------------------------------------------------------- curva */
.curva { flex:1; min-height:0; margin-top:.7cqw; }
.curva svg { width:100%; height:100%; display:block; }
.eixo { fill: var(--lf-tinta-3); font-family: var(--lf-f-mono); font-size:.7cqw; }
.malha { stroke: var(--lf-fio-suave); stroke-width:1; }
.marca { stroke: var(--lf-tinta-3); stroke-width:1; }
.rot-curva { font-family: var(--lf-f-mono); font-size:.78cqw; }

/* -------------------------------------------- barras de quem segura */
.pessoas { display:grid; gap:.75cqw; margin-top:.85cqw; }
.p-linha { display:grid; grid-template-columns:8.5cqw 1fr 3.4cqw; gap:1cqw; align-items:center; }
.p-nome { font-size:1cqw; color: var(--lf-tinta-2); white-space:nowrap;
          overflow:hidden; text-overflow:ellipsis; }
.p-bar { height:1.35cqw; background: var(--lf-serie-trilho); border-radius: var(--lf-r1);
         display:flex; overflow:hidden; }
.p-bar i { display:block; height:100%; }
.p-bar i + i { border-left:2px solid var(--lf-fundo); }
.p-val { font-family: var(--lf-f-mono); font-size:1.15cqw; font-weight:500;
         text-align:right; color: var(--lf-tinta); }

/* --------------------------------------------- histórico e destaques */
.meses { display:flex; gap:.6cqw; align-items:flex-end; height:5.4cqw; margin-top:.8cqw; }
.mes { flex:1; display:flex; flex-direction:column; align-items:center; gap:.3cqw; }
.mes .p { font-family: var(--lf-f-mono); font-size:.76cqw; color: var(--lf-tinta-3); }
.mes .b { width:100%; border-radius: var(--lf-r1) var(--lf-r1) 0 0; }
.mes .m { font-family: var(--lf-f-mono); font-size:.72cqw; color: var(--lf-tinta-3); }
.mes.atual .p { color: var(--lf-tinta); }

.destaques { display:grid; grid-template-columns:repeat(3,1fr); align-items:center; }
.dest { padding:0 1.9cqw; border-left:1px solid var(--lf-fio); }
.dest:first-child { border-left:0; }
.dest .v { font-family: var(--lf-f-titulo); font-weight:800; font-size:3.1cqw;
           line-height:1; letter-spacing:-.04em; font-variant-numeric: tabular-nums; }
.dest .k { font-size:.82cqw; color: var(--lf-tinta-2); margin-top:.4cqw; line-height:1.35; }
.dest .k b { color: var(--lf-tinta); font-weight:600; }

.aviso-topo { flex:none; background: var(--lf-erro-fundo); color: var(--lf-erro);
              border-bottom:1px solid var(--lf-erro-fio); padding:.5cqw 1.9cqw;
              font-size:.8cqw; display:flex; gap:.6cqw; align-items:center; }
.aviso-topo b { font-family: var(--lf-f-mono); }
.carregando { display:grid; place-items:center; height:100%; color: var(--lf-tinta-3); font-size:1.1cqw; }
</style>
</head>
<body>
<div class="palco" id="palco"><div class="carregando">Lendo o Acessórias…</div></div>

<script src="logos.js"></script>
<script src="comum.js"></script>
<script>
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESES_LONGO = { jan:'janeiro', fev:'fevereiro', mar:'março', abr:'abril', mai:'maio',
                      jun:'junho', jul:'julho', ago:'agosto', set:'setembro',
                      out:'outubro', nov:'novembro', dez:'dezembro' };
let FECH = null, OPER = null, COMP = null;

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const nfmt = n => Number(n || 0).toLocaleString('pt-BR');
const dec = (n, d = 1) => Number(n || 0).toLocaleString('pt-BR',
  { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = n => dec(n) + '%';
const ordemComp = c => {
  const m = String(c || '').match(/([a-z]{3})\/(\d{2})/);
  return m ? parseInt(m[2]) * 100 + MESES.indexOf(m[1]) + 1 : 0;
};
const compLongo = c => {
  const m = String(c || '').match(/([a-z]{3})\/(\d{2})/);
  return m ? `${MESES_LONGO[m[1]]} de 20${m[2]}` : c;
};
const dataBR = iso => {
  const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[3]}/${m[2]}` : '—';
};
function primeiroNome(n) {
  const t = String(n || '').trim();
  if (!t) return '—';
  if (/^sem respons/i.test(t)) return 'Sem responsável';
  const [a, b] = t.split(' ');
  return b ? `${a} ${b[0]}.` : a;
}

function compVizinha(c, passo) {
  const l = FECH.competencias.slice().sort((a, b) => ordemComp(a) - ordemComp(b));
  const i = l.indexOf(c);
  return (i >= 0 && i + passo >= 0 && i + passo < l.length) ? l[i + passo] : null;
}

/* --------------------------------------------------------- dados */
const ler = () => Promise.all([
  fetch('data/fechamento.json?ts=' + Date.now()).then(r => r.json()),
  fetch('data/operacional.json?ts=' + Date.now()).then(r => r.json()),
]);
async function carregar() {
  try { [FECH, OPER] = await ler(); }
  catch (e) {
    $('#palco').innerHTML = `<div class="carregando">Não consegui ler os dados do Acessórias.
      Abra o painel pelo atalho, não pelo arquivo. (${esc(e.message)})</div>`;
    return;
  }
  COMP = FECH.competencia_foco;
  desenhar();
  setInterval(async () => {
    try {
      const [a, o] = await ler();
      if (a.meta.atualizado_em === FECH.meta.atualizado_em) return;
      FECH = a; OPER = o; desenhar();
    } catch (e) { /* rede caiu: segue mostrando o último número lido */ }
  }, 5 * 60 * 1000);
}

/* -------------------------------------------------------- desenho */
function desenhar() {
  const b = FECH.fechamento[COMP];
  const idade = idadeDosDados(FECH.meta);
  const antes = compVizinha(COMP, -1), depois = compVizinha(COMP, 1);

  $('#palco').innerHTML = `
    <header class="topo">
      <img class="logo" src="${LOGOS.larafy_branca}" alt="LaraFy">
      <h1>Fechamento contábil <em>— ${esc(compLongo(COMP))}</em></h1>
      <div class="comp-nav">
        <button class="comp-seta" id="ant" ${antes ? '' : 'disabled'}
                aria-label="Competência anterior">&lsaquo;</button>
        <span class="comp-atual">${esc(COMP)}</span>
        <button class="comp-seta" id="prox" ${depois ? '' : 'disabled'}
                aria-label="Próxima competência">&rsaquo;</button>
      </div>
      <div class="fonte${idade.velho ? ' velha' : ''}">
        <span class="pt"></span>
        <span>Acessórias · ${nfmt(FECH.meta.total_empresas)} empresas ·
          ${idade.velho ? 'sem atualizar desde ' + esc(idade.quando) : 'atualizado ' + esc(idade.texto)}</span>
        <button class="btn-tv" id="cheia" title="Tecla F">${
          document.fullscreenElement ? 'Sair' : 'Tela cheia'}</button>
      </div>
    </header>
    ${idade.velho ? `<div class="aviso-topo">
      Os números são de <b>${esc(idade.quando)}</b> — a atualização automática não rodou desde então.
    </div>` : ''}

    <div class="corpo">
      <div class="bloco bl-num">${blocoNumero(b)}</div>
      <div class="bloco bl-curva">${blocoCurva()}</div>
      <div class="rodape-blocos">
        <div class="bloco" style="border-right:1px solid var(--lf-fio);padding-top:1.2cqw">
          ${blocoMeses()}
        </div>
        <div class="bloco" style="padding:1.2cqw 0">${blocoDestaques(b)}</div>
      </div>
    </div>`;

  $('#ant').onclick = () => { const c = compVizinha(COMP, -1); if (c) { COMP = c; desenhar(); } };
  $('#prox').onclick = () => { const c = compVizinha(COMP, 1); if (c) { COMP = c; desenhar(); } };
  $('#cheia').onclick = alternarTelaCheia;
  desenharCurva(b);
}

/* Coluna da esquerda: o número, os três estados e o ritmo em barras. */
function blocoNumero(b) {
  const r = b.ritmo || {};
  const falta = b.total - b.concluidas;
  const w = n => b.total ? (n / b.total) * 100 : 0;
  const cor = r.prazo_vencido
    ? (b.percentual >= 95 ? 'var(--lf-ok)' : b.percentual >= 80 ? 'var(--lf-atencao)' : 'var(--lf-erro)')
    : 'var(--lf-serie-1)';

  // as duas barras do ritmo dividem a mesma escala: dá para ver o tamanho da diferença
  const maxRitmo = Math.max(r.por_dia || 0, r.por_dia_necessario || 0, 1);
  const prazoTxt = r.prazo_vencido
    ? `prazo venceu em ${dataBR(b.prazo_legal)}`
    : `prazo em ${r.dias_uteis_restantes} dia${r.dias_uteis_restantes === 1 ? '' : 's'} úteis`;

  return `
    <div class="gigante" style="color:${cor}">${pct(b.percentual)}</div>
    <div class="sub"><b>${nfmt(b.concluidas)}</b> de <b>${nfmt(b.total)}</b> empresas fechadas</div>
    <div class="barrona">
      ${b.concluidas ? `<i style="width:${w(b.concluidas)}%;background:${cor}"></i>` : ''}
      ${b.atrasadas ? `<i style="width:${w(b.atrasadas)}%;background:var(--lf-erro)"></i>` : ''}
      ${b.pendentes ? `<i style="width:${w(b.pendentes)}%;background:var(--lf-atencao)"></i>` : ''}
    </div>
    <div class="tres">
      <div><div class="v c-ok">${nfmt(b.concluidas)}</div><div class="k">fechadas</div></div>
      <div><div class="v c-at">${nfmt(falta)}</div><div class="k">faltam</div></div>
      <div><div class="v c-er">${nfmt(b.atrasadas)}</div><div class="k">atrasadas</div></div>
    </div>
    ${blocoRegime(b)}
    <div class="ritmo">
      <div class="rot">Ritmo por dia útil <span>· ${prazoTxt}</span></div>
      <div class="rit-linha">
        <span class="n">${dec(r.por_dia)}</span>
        <span class="bar" style="width:${((r.por_dia || 0) / maxRitmo) * 100}%;
              background:var(--lf-serie-1)"></span>
        <span class="leg">fechando hoje</span>
      </div>
      <div class="rit-linha">
        <span class="n" style="color:var(--lf-erro)">${
          r.por_dia_necessario === null ? '—' : dec(r.por_dia_necessario)}</span>
        <span class="bar" style="width:${((r.por_dia_necessario || 0) / maxRitmo) * 100}%;
              background:var(--lf-erro)"></span>
        <span class="leg">precisaria fechar</span>
      </div>
    </div>`;
}

/* Por regime: três barras curtas, para ver de relance qual carteira anda. */
function blocoRegime(b) {
  const lista = (b.por_regime || []).filter(r => r.total >= 5).slice(0, 4);
  if (!lista.length) return '';
  return `
    <div style="margin-top:1.6cqw;padding-top:1.3cqw;border-top:1px solid var(--lf-fio)">
      <div class="rot">Por regime</div>
      <div class="pessoas" style="gap:.6cqw;margin-top:.7cqw">
        ${lista.map(r => `<div class="p-linha" style="grid-template-columns:7.6cqw 1fr 3.2cqw">
          <span class="p-nome" style="font-size:.86cqw">${esc(r.regime)}</span>
          <span class="p-bar" style="height:1cqw">
            <i style="width:${r.percentual}%;background:var(--lf-ok)"></i>
          </span>
          <span class="p-val" style="font-size:.95cqw">${dec(r.percentual, 0)}%</span>
        </div>`).join('')}
      </div>
    </div>`;
}

/* Coluna da direita: a curva em cima, quem está segurando embaixo. */
function blocoCurva() {
  return `
    <div class="rot">Empresas fechadas ao longo do ciclo <span id="sub-curva"></span></div>
    <div class="curva"><svg id="curva" preserveAspectRatio="none"></svg></div>
    <div id="quem"></div>`;
}

function blocoQuem(b) {
  const lista = (b.por_responsavel || [])
    .filter(x => x.pendentes + x.atrasadas > 0)
    .sort((a, c) => (c.pendentes + c.atrasadas) - (a.pendentes + a.atrasadas))
    .slice(0, 5);
  if (!lista.length) return '';
  const max = Math.max(...lista.map(x => x.pendentes + x.atrasadas));
  return `
    <div class="rot" style="margin-top:1.2cqw;padding-top:1.2cqw;
         border-top:1px solid var(--lf-fio)">Quem está com mais fechamento em aberto</div>
    <div class="pessoas">
      ${lista.map(x => {
        const ab = x.pendentes + x.atrasadas, larg = (ab / max) * 100;
        const pAtr = ab ? (x.atrasadas / ab) * larg : 0;
        return `<div class="p-linha">
          <span class="p-nome">${esc(primeiroNome(x.nome))}</span>
          <span class="p-bar">
            ${x.atrasadas ? `<i style="width:${pAtr}%;background:var(--lf-erro)"></i>` : ''}
            ${x.pendentes ? `<i style="width:${larg - pAtr}%;background:var(--lf-atencao)"></i>` : ''}
          </span>
          <span class="p-val">${nfmt(ab)}</span>
        </div>`;
      }).join('')}
    </div>`;
}

/* Faixa de baixo, esquerda: onde cada mês terminou. */
function blocoMeses() {
  const comps = FECH.competencias
    .filter(c => ordemComp(c) <= ordemComp(FECH.competencia_foco))
    .slice(0, 6).reverse();
  if (comps.length < 2) return '';
  return `
    <div class="rot">Onde cada mês terminou</div>
    <div class="meses">
      ${comps.map(c => {
        const x = FECH.fechamento[c], atual = c === COMP;
        return `<div class="mes${atual ? ' atual' : ''}">
          <span class="p">${dec(x.percentual, 0)}%</span>
          <span class="b" style="height:${Math.max(3, (x.percentual / 100) * 68)}px;
            background:${atual ? 'var(--lf-serie-1)' : 'var(--lf-serie-outros)'}"></span>
          <span class="m">${esc(c.slice(0, 3))}</span>
        </div>`;
      }).join('')}
    </div>`;
}

/* Faixa de baixo, direita: os três números que mandam agir. */
function blocoDestaques(b) {
  const tres = (FECH.arrastando || []).filter(x => x.total_meses >= 3).length;
  const p = OPER ? OPER.passivo : null;
  const o = OPER ? OPER.por_competencia[OPER.competencia_foco] : null;
  const pior = o && (o.obrigacoes || []).filter(x => x.atrasadas > 0)
    .sort((a, c) => c.atrasadas - a.atrasadas)[0];

  const itens = [];
  itens.push({ v: nfmt(FECH.arrastando_total || 0), cor: 'var(--lf-erro)',
    k: `empresas com o fechamento em aberto há <b>mais de um mês</b>${
        tres ? ` — ${nfmt(tres)} delas há três` : ''}` });
  if (pior) itens.push({ v: nfmt(pior.atrasadas), cor: 'var(--lf-erro)',
    k: `empresas com <b>${esc(pior.obrigacao)}</b> atrasada` });
  if (p) itens.push({ v: nfmt(p.total), cor: 'var(--lf-atencao)',
    k: `obrigações do escritório venceram e <b>seguem sem entrega</b>` });

  return `<div class="destaques">
    ${itens.slice(0, 3).map(i => `<div class="dest">
      <div class="v" style="color:${i.cor}">${i.v}</div>
      <div class="k">${i.k}</div></div>`).join('')}
  </div>`;
}

/* ---------------------------------------------------------- curva */
function desenharCurva(b) {
  const alvo = document.getElementById('quem');
  if (alvo) alvo.innerHTML = blocoQuem(b);

  const svg = document.getElementById('curva');
  if (!svg) return;
  const caixa = svg.parentElement.getBoundingClientRect();
  const W = Math.max(320, caixa.width), H = Math.max(90, caixa.height);
  const M = { t: 18, r: 26, b: 22, l: 38 };

  const serie = bloco => {
    if (!bloco || !bloco.curva || !bloco.curva.length) return [];
    const t0 = new Date((bloco.abre_em || bloco.curva[0].dia) + 'T00:00:00');
    return bloco.curva.map(p => ({
      x: Math.round((new Date(p.dia + 'T00:00:00') - t0) / 86400000), y: p.percentual }));
  };
  const ant = compVizinha(COMP, -1);
  const sA = serie(b), sB = serie(ant ? FECH.fechamento[ant] : null);
  const sub = document.getElementById('sub-curva');
  if (sub) sub.textContent = ant ? `· ${COMP} contra ${ant}, dia a dia` : `· ${COMP}`;

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  if (!sA.length && !sB.length) {
    svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" text-anchor="middle" class="eixo">
      Nenhuma empresa fechada até agora</text>`;
    return;
  }

  const diaHoje = b.abre_em
    ? Math.floor((Date.now() - new Date(b.abre_em + 'T00:00:00')) / 86400000) : null;
  const diaPrazo = (b.abre_em && b.prazo_legal)
    ? Math.round((new Date(b.prazo_legal + 'T00:00:00') - new Date(b.abre_em + 'T00:00:00')) / 86400000)
    : null;
  const maxX = Math.max(1, ...sA.map(p => p.x), ...sB.map(p => p.x),
                        diaPrazo || 0, diaHoje == null ? 0 : diaHoje);
  const minX = Math.min(0, ...sA.map(p => p.x), ...sB.map(p => p.x));
  const maxY = Math.max(20, Math.ceil(Math.max(...sA.map(p => p.y), ...sB.map(p => p.y), 0) / 20) * 20);
  const px = x => M.l + ((x - minX) / (maxX - minX)) * (W - M.l - M.r);
  const py = y => H - M.b - (y / maxY) * (H - M.t - M.b);
  const dl = s => s.map((p, i) => (i ? 'L' : 'M') + px(p.x).toFixed(1) + ' ' + py(p.y).toFixed(1)).join(' ');
  const area = s => s.length
    ? `${dl(s)} L ${px(s[s.length - 1].x).toFixed(1)} ${py(0)} L ${px(s[0].x).toFixed(1)} ${py(0)} Z` : '';

  const rot = (s, cor, nome) => {
    if (!s.length) return '';
    const u = s[s.length - 1];
    const txt = `${nome} ${pct(u.y)}`;
    const cabe = px(u.x) + 8 + txt.length * (H * 0.062) <= W - 2;
    return `<circle cx="${px(u.x)}" cy="${py(u.y)}" r="3.6" fill="${cor}"/>
      <text x="${px(u.x) + (cabe ? 8 : -8)}" y="${py(u.y) - 8}" class="rot-curva"
        text-anchor="${cabe ? 'start' : 'end'}" fill="${cor}">${esc(txt)}</text>`;
  };

  svg.innerHTML = `
    <defs><linearGradient id="sob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--lf-serie-1)" stop-opacity=".22"/>
      <stop offset="100%" stop-color="var(--lf-serie-1)" stop-opacity="0"/>
    </linearGradient></defs>
    ${[0, maxY / 2, maxY].map(v => `
      <line class="malha" x1="${M.l}" x2="${W - M.r}" y1="${py(v)}" y2="${py(v)}"/>
      <text class="eixo" x="${M.l - 7}" y="${py(v) + 4}" text-anchor="end">${v}%</text>`).join('')}
    <text class="eixo" x="${px(0)}" y="${H - M.b + 15}" text-anchor="middle">abertura</text>
    ${diaPrazo != null && diaPrazo <= maxX ? `
      <line x1="${px(diaPrazo)}" x2="${px(diaPrazo)}" y1="${M.t}" y2="${H - M.b}"
            stroke="var(--lf-erro)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".7"/>
      <text class="eixo" x="${px(diaPrazo)}" y="${H - M.b + 15}" text-anchor="middle"
            fill="var(--lf-erro)">prazo</text>` : ''}
    ${diaHoje != null && diaHoje >= 0 && diaHoje <= maxX ? `
      <line class="marca" x1="${px(diaHoje)}" x2="${px(diaHoje)}" y1="${M.t}" y2="${H - M.b}"/>
      <text class="eixo" x="${px(diaHoje)}" y="${M.t - 5}" text-anchor="middle">hoje</text>` : ''}
    ${sB.length ? `<path d="${dl(sB)}" fill="none" stroke="var(--lf-serie-outros)"
        stroke-width="2" stroke-dasharray="6 5"/>` : ''}
    ${sA.length ? `<path d="${area(sA)}" fill="url(#sob)" stroke="none"/>` : ''}
    ${sA.length ? `<path d="${dl(sA)}" fill="none" stroke="var(--lf-serie-1)" stroke-width="3.2"
        stroke-linejoin="round"/>` : ''}
    ${rot(sB, 'var(--lf-serie-outros)', ant)}
    ${rot(sA, 'var(--lf-serie-1)', COMP)}`;
}

/* ------------------------------------------------------ tela cheia */
async function alternarTelaCheia() {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch (e) {
    console.warn('Tela cheia indisponível neste navegador:', e.message);
  }
}
document.addEventListener('fullscreenchange', () => {
  const b = document.getElementById('cheia');
  if (b) b.textContent = document.fullscreenElement ? 'Sair' : 'Tela cheia';
  if (!document.fullscreenElement) {
    clearTimeout(tempoPonteiro);
    document.querySelector('.palco')?.classList.remove('sem-ponteiro');
  } else esconderPonteiroDepois();
  if (FECH) desenharCurva(FECH.fechamento[COMP]);
});
let tempoPonteiro;
function esconderPonteiroDepois() {
  clearTimeout(tempoPonteiro);
  const palco = document.querySelector('.palco');
  if (!palco) return;
  palco.classList.remove('sem-ponteiro');
  if (!document.fullscreenElement) return;
  tempoPonteiro = setTimeout(() => palco.classList.add('sem-ponteiro'), 3000);
}
document.addEventListener('mousemove', esconderPonteiroDepois);
document.addEventListener('keydown', ev => {
  if (ev.ctrlKey || ev.altKey || ev.metaKey) return;
  if (ev.key.toLowerCase() === 'f') { ev.preventDefault(); alternarTelaCheia(); }
  else if (ev.key === 'ArrowLeft') { const c = compVizinha(COMP, -1); if (c) { COMP = c; desenhar(); } }
  else if (ev.key === 'ArrowRight') { const c = compVizinha(COMP, 1); if (c) { COMP = c; desenhar(); } }
});

let t;
window.addEventListener('resize', () => {
  clearTimeout(t);
  t = setTimeout(() => { if (FECH) desenharCurva(FECH.fechamento[COMP]); }, 150);
});
carregar();
</script>
