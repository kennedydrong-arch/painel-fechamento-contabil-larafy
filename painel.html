<!doctype html>
<!-- O painel vive numa TV: tema escuro fixo. -->
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Fechamento Contábil · LaraFy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="kit.css">
<style>
/* ============================================================
   Fechamento contábil — painel de parede.

   As peças são as do kit LaraFy (kit.css), usadas como estão:
   .faixa-num, .deitadas, .colunas, .destaque, .aviso, .mrc.
   Aqui só existe o que o kit não tem: o arranjo da tela.

   O palco é desenhado em 1600×900 e escalado inteiro para caber
   na janela. É o que permite manter as medidas do kit em pixel,
   sem deformar peça nenhuma, do notebook à TV.
   ============================================================ */

/* A cor do dado vem do site da LaraTAX (#00c4e5), não do azul apagado que o
   modo escuro do kit usa. É a mesma cor que a marca aplica de verdade, e no
   fundo escuro ela aparece; o #07e0ff continua reservado ao acento. */
:root[data-theme="dark"] {
  --s1: #00c4e5;
  --trilho: #142832;
  --fio: #1E333F;
  --fio2: #17272F;
}

html, body { height:100%; overflow:hidden; }
body { margin:0; background:var(--fundo); display:grid; place-items:center; }

.moldura { width:100vw; height:100vh; display:grid; place-items:center; overflow:hidden; }
.palco {
  width:1600px; height:900px; flex:none;
  background:var(--fundo); color:var(--tin);
  display:flex; flex-direction:column;
  transform:scale(var(--esc, 1)); transform-origin:center;
}
.palco.sem-ponteiro, .palco.sem-ponteiro * { cursor:none; }

/* ------------------------------------------------------ cabeçalho */
.topo {
  flex:none; height:62px; background:#002E43; color:#fff;
  display:flex; align-items:center; gap:22px; padding:0 30px;
}
:root[data-theme="dark"] .topo { background:#02202F; }
.topo img { height:26px; width:auto; display:block; }
.topo h1 { font-family:var(--fd); font-weight:800; font-size:19px;
           letter-spacing:-.035em; margin:0; white-space:nowrap; }
.topo h1 span { color:#8FB0C0; font-weight:400; letter-spacing:-.02em; }
.nav-comp { display:flex; align-items:center; gap:2px; }
.nav-comp button {
  background:none; border:0; color:#8FB0C0; cursor:pointer; font-size:17px;
  line-height:1; padding:4px 8px; border-radius:3px;
}
.nav-comp button:hover:not(:disabled) { color:#fff; background:rgba(255,255,255,.09); }
.nav-comp button:disabled { opacity:.25; cursor:default; }
.nav-comp .agora {
  font-family:var(--fm); font-size:13px; color:#fff; min-width:66px; text-align:center;
  border-bottom:2px solid #07E0FF; padding-bottom:2px;
}
.fonte {
  margin-left:auto; display:flex; align-items:center; gap:12px;
  font-family:var(--fm); font-size:11.5px; color:#8FB0C0; white-space:nowrap;
}
.fonte .pt { width:7px; height:7px; border-radius:99px; background:#07E0FF; flex:none; }
.fonte.velha { color:#F0B3AC; } .fonte.velha .pt { background:#E8807A; }
.btn-tv {
  background:none; border:1px solid rgba(255,255,255,.26); color:#8FB0C0;
  font-family:var(--fb); font-size:12px; border-radius:4px; padding:4px 10px; cursor:pointer;
}
.btn-tv:hover { color:#fff; border-color:#fff; }

/* --------------------------------------------------------- arranjo */
.corpo { flex:1; min-height:0; display:flex; flex-direction:column; padding:0 30px; }

.abre { display:flex; align-items:flex-end; gap:26px; padding:24px 0 20px; }
.abre .pc {
  font-family:var(--fd); font-weight:800; font-size:92px; line-height:.82;
  letter-spacing:-.045em; font-variant-numeric:tabular-nums;
}
.abre .txt { padding-bottom:6px; }
.abre .txt .l1 { font-family:var(--fd); font-weight:700; font-size:21px; letter-spacing:-.03em; }
.abre .txt .l1 u { font-family:var(--fm); font-weight:500; text-decoration:none; }
.abre .txt .l2 { color:var(--tin2); font-size:14.5px; margin-top:5px; }
.abre .marcas { margin-left:auto; display:flex; gap:8px; padding-bottom:8px; }

.meio { flex:1; min-height:0; display:grid; grid-template-columns:1fr 470px; gap:38px;
        padding:22px 0 0; border-top:1px solid var(--fio); }
.meio > div { min-width:0; display:flex; flex-direction:column; }

.tit-graf { display:flex; align-items:baseline; justify-content:space-between; gap:14px; }
.linha-svg { flex:1; min-height:0; margin-top:10px; }
.linha-svg svg { width:100%; height:100%; display:block; }
.eixo-t { fill:var(--fr); font-family:var(--fm); font-size:11px; }
.malha-l { stroke:var(--fio2); stroke-width:1; }
.rot-l { font-family:var(--fm); font-size:12.5px; }

.fecha { flex:none; padding:20px 0 22px; border-top:1px solid var(--fio); margin-top:20px;
         display:grid; grid-template-columns:1fr 470px; gap:38px; align-items:end; }

.graf-col { height:90px; position:relative; max-width:430px; }
.graf-col .colunas { gap:10px; }
.graf-col .colunas b { opacity:.5; }
.graf-col .colunas b.hoje { opacity:1; background:var(--s1); }
.graf-col .colunas b { border-radius:3px 3px 0 0; }
.meses-r { display:flex; gap:10px; margin:6px 0 0 46px; max-width:384px; }
.meses-r span { flex:1; text-align:center; font-family:var(--fm); font-size:11px; color:var(--fr); }
.meses-r span.hoje { color:var(--tin); }

.carregando { display:grid; place-items:center; height:100%; color:var(--fr); font-size:16px; }
</style>
</head>
<body>
<div class="moldura"><div class="palco" id="palco"><div class="carregando">Lendo o Acessórias…</div></div></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></symbol>
  <symbol id="i-alerta" viewBox="0 0 24 24"><path d="M12 8v5M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-relogio" viewBox="0 0 24 24"><path d="M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></symbol>
</svg>

<script src="logos.js"></script>
<script src="comum.js"></script>
<script>
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESES_LONGO = { jan:'janeiro', fev:'fevereiro', mar:'março', abr:'abril', mai:'maio',
                      jun:'junho', jul:'julho', ago:'agosto', set:'setembro',
                      out:'outubro', nov:'novembro', dez:'dezembro' };
let FECH = null, OPER = null, COMP = null;

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const nfmt = n => Number(n || 0).toLocaleString('pt-BR');
const dec = (n, d = 1) => Number(n || 0).toLocaleString('pt-BR',
  { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = n => dec(n) + '%';
const ordemComp = c => {
  const m = String(c || '').match(/([a-z]{3})\/(\d{2})/);
  return m ? parseInt(m[2]) * 100 + MESES.indexOf(m[1]) + 1 : 0;
};
const compLongo = c => {
  const m = String(c || '').match(/([a-z]{3})\/(\d{2})/);
  return m ? `${MESES_LONGO[m[1]]} de 20${m[2]}` : c;
};
const dataBR = iso => {
  const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[3]}/${m[2]}` : '—';
};
function nomeCurto(n) {
  const t = String(n || '').trim();
  if (!t) return '—';
  if (/^sem respons/i.test(t)) return 'Sem responsável';
  const [a, b] = t.split(' ');
  return b ? `${a} ${b[0]}.` : a;
}
function compVizinha(c, passo) {
  const l = FECH.competencias.slice().sort((a, b) => ordemComp(a) - ordemComp(b));
  const i = l.indexOf(c);
  return (i >= 0 && i + passo >= 0 && i + passo < l.length) ? l[i + passo] : null;
}
const marca = (cls, icone, txt) =>
  `<span class="mrc ${cls}"><svg><use href="#${icone}"></use></svg>${esc(txt)}</span>`;

/* ------------------------------------------------------------ dados */
const ler = () => Promise.all([
  fetch('data/fechamento.json?ts=' + Date.now()).then(r => r.json()),
  fetch('data/operacional.json?ts=' + Date.now()).then(r => r.json()),
]);
async function carregar() {
  try { [FECH, OPER] = await ler(); }
  catch (e) {
    $('#palco').innerHTML = `<div class="carregando">Não consegui ler os dados do Acessórias.
      Abra o painel pelo atalho, não pelo arquivo. (${esc(e.message)})</div>`;
    return;
  }
  COMP = FECH.competencia_foco;
  desenhar();
  setInterval(async () => {
    try {
      const [a, o] = await ler();
      if (a.meta.atualizado_em === FECH.meta.atualizado_em) return;
      FECH = a; OPER = o; desenhar();
    } catch (e) { /* rede caiu: segue mostrando o último número lido */ }
  }, 5 * 60 * 1000);
}

/* ---------------------------------------------------------- desenho */
function desenhar() {
  const b = FECH.fechamento[COMP];
  const idade = idadeDosDados(FECH.meta);
  const antes = compVizinha(COMP, -1), depois = compVizinha(COMP, 1);
  const r = b.ritmo || {};
  const falta = b.total - b.concluidas;

  const estado = r.prazo_vencido
    ? (falta === 0 ? marca('ok', 'i-check', 'competência fechada')
                   : marca('mal', 'i-x', `prazo venceu em ${dataBR(b.prazo_legal)}`))
    : falta === 0 ? marca('ok', 'i-check', 'competência fechada')
    : marca('al', 'i-alerta', `prazo em ${r.dias_uteis_restantes} dia${
        r.dias_uteis_restantes === 1 ? '' : 's'} úteis`);

  $('#palco').innerHTML = `
    <header class="topo">
      <img src="${LOGOS.larafy_branca}" alt="LaraFy">
      <h1>Fechamento contábil <span>— ${esc(compLongo(COMP))}</span></h1>
      <div class="nav-comp">
        <button id="ant" ${antes ? '' : 'disabled'} aria-label="Competência anterior">&lsaquo;</button>
        <span class="agora">${esc(COMP)}</span>
        <button id="prox" ${depois ? '' : 'disabled'} aria-label="Próxima competência">&rsaquo;</button>
      </div>
      <div class="fonte${idade.velho ? ' velha' : ''}">
        <span class="pt"></span>
        <span>Acessórias · ${nfmt(FECH.meta.total_empresas)} empresas ·
          ${idade.velho ? 'sem atualizar desde ' + esc(idade.quando)
                        : 'atualizado ' + esc(idade.texto)}</span>
        <button class="btn-tv" id="cheia" title="Tecla F">${
          document.fullscreenElement ? 'Sair' : 'Tela cheia'}</button>
      </div>
    </header>

    <div class="corpo">
      <div class="abre">
        <span class="pc" style="color:${corDo(b)}">${pct(b.percentual)}</span>
        <span class="txt">
          <span class="l1"><u>${nfmt(b.concluidas)}</u> de <u>${nfmt(b.total)}</u> empresas fechadas</span>
          <span class="l2">faltam ${nfmt(falta)} para o mês fechar${
            b.dispensadas ? ` · ${nfmt(b.dispensadas)} dispensadas ficam fora da conta` : ''}</span>
        </span>
        <span class="marcas">${estado}</span>
      </div>

      ${faixaNumeros(b)}

      <div class="meio">
        <div>
          <div class="tit-graf">
            <p class="marca" style="margin:0">Empresas fechadas ao longo do ciclo</p>
            <span class="txt-est" id="leg-curva"></span>
          </div>
          <div class="linha-svg"><svg id="curva" preserveAspectRatio="none"></svg></div>
        </div>
        <div>${colunaDireita(b)}${avisoFinal(b)}</div>
      </div>

      <div class="fecha">
        <div>
          <p class="marca">Onde cada mês terminou</p>
          ${grafMeses()}
        </div>
        <div>${numerosFinais()}</div>
      </div>
    </div>`;

  $('#ant').onclick = () => { const c = compVizinha(COMP, -1); if (c) { COMP = c; desenhar(); } };
  $('#prox').onclick = () => { const c = compVizinha(COMP, 1); if (c) { COMP = c; desenhar(); } };
  $('#cheia').onclick = alternarTelaCheia;
  desenharCurva(b);
}

function corDo(b) {
  const r = b.ritmo || {};
  if (!r.prazo_vencido) return 'var(--s1)';
  return b.percentual >= 95 ? 'var(--ok)' : b.percentual >= 80 ? 'var(--al)' : 'var(--mal)';
}

/* Peça do kit: faixa de números, células separadas por fio. O valor é mono. */
function faixaNumeros(b) {
  const r = b.ritmo || {};
  const ref = refAnterior(b);
  const cel = (rot, val, det, cls) => `<div>
    <div class="r">${rot}</div>
    <div class="v${cls ? ' ' + cls : ''}">${val}</div>
    <div class="d">${det}</div></div>`;
  return `<div class="faixa-num">
    ${cel('Fechadas', nfmt(b.concluidas),
          ref ? `${ref.dif >= 0 ? '+' : '−'}${dec(Math.abs(ref.dif))} p.p. vs ${ref.comp} no mesmo ponto`
              : `${pct(b.percentual)} do total`)}
    ${cel('Em aberto', nfmt(b.pendentes + b.atrasadas),
          b.atrasadas ? `${nfmt(b.atrasadas)} já em atraso` : 'nenhuma em atraso ainda',
          b.atrasadas ? 'mal' : '')}
    ${cel('Fechando por dia útil', dec(r.por_dia),
          `em ${r.dias_uteis_corridos} dias de ciclo`)}
    ${cel('Precisaria por dia', r.por_dia_necessario === null ? '—' : dec(r.por_dia_necessario),
          r.prazo_vencido ? 'prazo vencido'
            : `nos ${r.dias_uteis_restantes} dias úteis que restam`,
          r.por_dia_necessario > r.por_dia ? 'mal' : '')}
  </div>`;
}

/* Onde a competência anterior estava no MESMO ponto do ciclo. */
function refAnterior(b) {
  const ant = compVizinha(COMP, -1);
  const bAnt = ant ? FECH.fechamento[ant] : null;
  if (!bAnt || !b.abre_em || !bAnt.abre_em) return null;
  const dia = Math.floor((Date.now() - new Date(b.abre_em + 'T00:00:00')) / 86400000);
  if (dia < 0) return null;
  const alvo = new Date(new Date(bAnt.abre_em + 'T00:00:00').getTime() + dia * 86400000)
    .toISOString().slice(0, 10);
  const ate = bAnt.curva.filter(p => p.dia <= alvo);
  const v = ate.length ? ate[ate.length - 1].percentual : 0;
  return { comp: ant, percentual: v, dif: b.percentual - v };
}

/* Peça do kit: barras deitadas, nome e valor acima do trilho. */
function colunaDireita(b) {
  const lista = (b.por_responsavel || [])
    .filter(x => x.pendentes + x.atrasadas > 0)
    .sort((a, c) => (c.pendentes + c.atrasadas) - (a.pendentes + a.atrasadas))
    .slice(0, 6);
  const max = Math.max(1, ...lista.map(x => x.pendentes + x.atrasadas));
  const r = b.ritmo || {};
  const falta = b.total - b.concluidas;

  const veredito = falta === 0
    ? `<div class="destaque"><b>As ${nfmt(b.total)} empresas desta competência estão fechadas.</b></div>`
    : r.prazo_vencido
      ? `<div class="destaque"><b>${nfmt(falta)} empresas ficaram sem fechamento.</b>
          O prazo terminou em ${dataBR(b.prazo_legal)}.</div>`
      : r.por_dia_necessario > r.por_dia
        ? `<div class="destaque"><b>No ritmo atual seriam necessários
            ${nfmt(r.dias_uteis_no_ritmo)} dias úteis para as ${nfmt(falta)} que faltam.</b>
            O prazo termina em ${r.dias_uteis_restantes}.</div>`
        : `<div class="destaque"><b>O ritmo atual fecha as ${nfmt(falta)} que faltam no prazo.</b>
            Restam ${r.dias_uteis_restantes} dias úteis.</div>`;

  return `
    ${veredito}
    <p class="marca" style="margin:20px 0 10px">Quem está com mais fechamento em aberto</p>
    <div class="deitadas">
      ${lista.map(x => {
        const ab = x.pendentes + x.atrasadas;
        return `<div>
          <div class="l1"><span>${esc(nomeCurto(x.nome))}</span><u>${nfmt(ab)} de ${nfmt(x.total)}</u></div>
          <div class="trilho"><i style="width:${(ab / max) * 100}%"></i></div>
        </div>`;
      }).join('') || '<div class="vazio"><b>Nada em aberto</b></div>'}
    </div>`;
}

/* Peça do kit: gráfico de colunas com eixo à esquerda. */
function grafMeses() {
  const comps = FECH.competencias
    .filter(c => ordemComp(c) <= ordemComp(FECH.competencia_foco))
    .slice(0, 6).reverse();
  if (comps.length < 2) return '';
  const alt = 90;
  return `
    <div class="graf-col">
      <div class="eixo">
        <u style="top:0">100%</u><i style="top:0"></i>
        <u style="top:${alt / 2}px">50%</u><i style="top:${alt / 2}px"></i>
        <u style="top:${alt}px">0</u><i style="top:${alt - 1}px;background:var(--fio3)"></i>
      </div>
      <div class="colunas">
        ${comps.map(c => {
          const x = FECH.fechamento[c];
          return `<b class="${c === COMP ? 'hoje' : ''}" style="height:${Math.max(1.5, x.percentual)}%">
            <span class="dica">${esc(c)} · ${pct(x.percentual)}</span></b>`;
        }).join('')}
      </div>
    </div>
    <div class="meses-r">
      ${comps.map(c => `<span class="${c === COMP ? 'hoje' : ''}">${esc(c.slice(0, 3))}</span>`).join('')}
    </div>`;
}

/* Peça do kit: aviso — só quando há o que avisar, com número e nome. */
function avisoFinal(b) {
  const tres = (FECH.arrastando || []).filter(x => x.total_meses >= 3).length;
  const o = OPER ? OPER.por_competencia[OPER.competencia_foco] : null;
  const pior = o && (o.obrigacoes || []).filter(x => x.atrasadas > 0)
    .sort((a, c) => c.atrasadas - a.atrasadas)[0];
  const partes = [];
  if (FECH.arrastando_total) partes.push(
    `<b>${nfmt(FECH.arrastando_total)} empresas</b> estão com o fechamento em aberto há mais de um mês${
      tres ? `, ${nfmt(tres)} delas há três` : ''}.`);
  if (pior) partes.push(
    `<b>${esc(pior.obrigacao)}</b> está atrasada em ${nfmt(pior.atrasadas)} empresas.`);
  if (!partes.length) return '';
  return `<div class="aviso" style="margin-top:auto">${partes.join(' ')}</div>`;
}

/* Peça do kit: faixa de números, para o que vale do escritório inteiro. */
function numerosFinais() {
  const p = OPER ? OPER.passivo : null;
  if (!p) return '';
  const maior = Object.entries(p.por_time).sort((a, b) => b[1] - a[1])[0];
  return `<div class="faixa-num" style="grid-template-columns:1fr 1fr">
    <div><div class="r">Passivo do escritório</div>
      <div class="v mal">${nfmt(p.total)}</div>
      <div class="d">venceram e seguem sem entrega</div></div>
    <div><div class="r">Com multa prevista</div>
      <div class="v">${nfmt(p.com_multa)}</div>
      <div class="d">maior parte no ${esc(maior[0])} (${nfmt(maior[1])})</div></div>
  </div>`;
}

/* ------------------------------------------------------------ curva */
function desenharCurva(b) {
  const svg = document.getElementById('curva');
  if (!svg) return;
  const caixa = svg.parentElement.getBoundingClientRect();
  const esc0 = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--esc')) || 1;
  const W = Math.max(320, caixa.width / esc0), H = Math.max(120, caixa.height / esc0);
  const M = { t: 20, r: 30, b: 24, l: 44 };

  const serie = bloco => {
    if (!bloco || !bloco.curva || !bloco.curva.length) return [];
    const t0 = new Date((bloco.abre_em || bloco.curva[0].dia) + 'T00:00:00');
    return bloco.curva.map(p => ({
      x: Math.round((new Date(p.dia + 'T00:00:00') - t0) / 86400000), y: p.percentual }));
  };
  const ant = compVizinha(COMP, -1);
  const sA = serie(b), sB = serie(ant ? FECH.fechamento[ant] : null);
  const leg = document.getElementById('leg-curva');
  if (leg) leg.textContent = ant ? `${COMP} contra ${ant}, desde a abertura de cada ciclo` : COMP;

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  if (!sA.length && !sB.length) {
    svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" text-anchor="middle" class="eixo-t">
      Nenhuma empresa fechada até agora nesta competência</text>`;
    return;
  }

  const diaHoje = b.abre_em
    ? Math.floor((Date.now() - new Date(b.abre_em + 'T00:00:00')) / 86400000) : null;
  const diaPrazo = (b.abre_em && b.prazo_legal)
    ? Math.round((new Date(b.prazo_legal + 'T00:00:00') - new Date(b.abre_em + 'T00:00:00')) / 86400000)
    : null;
  const maxX = Math.max(1, ...sA.map(p => p.x), ...sB.map(p => p.x),
                        diaPrazo || 0, diaHoje == null ? 0 : diaHoje);
  const minX = Math.min(0, ...sA.map(p => p.x), ...sB.map(p => p.x));
  const maxY = Math.max(20, Math.ceil(Math.max(...sA.map(p => p.y), ...sB.map(p => p.y), 0) / 20) * 20);
  const px = x => M.l + ((x - minX) / (maxX - minX)) * (W - M.l - M.r);
  const py = y => H - M.b - (y / maxY) * (H - M.t - M.b);
  const dl = s => s.map((p, i) => (i ? 'L' : 'M') + px(p.x).toFixed(1) + ' ' + py(p.y).toFixed(1)).join(' ');
  const area = s => s.length
    ? `${dl(s)} L ${px(s[s.length - 1].x).toFixed(1)} ${py(0)} L ${px(s[0].x).toFixed(1)} ${py(0)} Z` : '';

  const rot = (s, cor, nome) => {
    if (!s.length) return '';
    const u = s[s.length - 1];
    const txt = `${nome} ${pct(u.y)}`;
    const cabe = px(u.x) + 9 + txt.length * 7.4 <= W - 2;
    return `<circle cx="${px(u.x)}" cy="${py(u.y)}" r="3" fill="${cor}"/>
      <text x="${px(u.x) + (cabe ? 9 : -9)}" y="${py(u.y) - 9}" class="rot-l"
        text-anchor="${cabe ? 'start' : 'end'}" fill="${cor}">${esc(txt)}</text>`;
  };

  svg.innerHTML = `
    ${[0, maxY / 2, maxY].map(v => `
      <line class="malha-l" x1="${M.l}" x2="${W - M.r}" y1="${py(v)}" y2="${py(v)}"/>
      <text class="eixo-t" x="${M.l - 8}" y="${py(v) + 4}" text-anchor="end">${v}%</text>`).join('')}
    <text class="eixo-t" x="${px(0)}" y="${H - M.b + 16}" text-anchor="middle">abertura</text>
    ${diaPrazo != null && diaPrazo <= maxX ? `
      <line x1="${px(diaPrazo)}" x2="${px(diaPrazo)}" y1="${M.t}" y2="${H - M.b}"
            stroke="var(--mal)" stroke-width="1" stroke-dasharray="4 4"/>
      <text class="eixo-t" x="${px(diaPrazo)}" y="${H - M.b + 16}" text-anchor="middle"
            fill="var(--mal)">prazo</text>` : ''}
    ${diaHoje != null && diaHoje >= 0 && diaHoje <= maxX ? `
      <line x1="${px(diaHoje)}" x2="${px(diaHoje)}" y1="${M.t}" y2="${H - M.b}"
            stroke="var(--fr)" stroke-width="1"/>
      <text class="eixo-t" x="${px(diaHoje)}" y="${M.t - 6}" text-anchor="middle">hoje</text>` : ''}
    ${sB.length ? `<path d="${dl(sB)}" fill="none" stroke="var(--sOut)" stroke-width="1.8"
        stroke-dasharray="5 4" stroke-linejoin="round"/>` : ''}
    ${sA.length ? `<path d="${area(sA)}" fill="var(--s1)" opacity=".10"/>` : ''}
    ${sA.length ? `<path d="${dl(sA)}" fill="none" stroke="var(--s1)" stroke-width="1.8"
        stroke-linejoin="round"/>` : ''}
    ${rot(sB, 'var(--sOut)', ant)}
    ${rot(sA, 'var(--s1)', COMP)}`;
}

/* ------------------------------------------ escala e tela cheia */
function ajustarEscala() {
  const esc = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
  document.documentElement.style.setProperty('--esc', esc.toFixed(4));
}
async function alternarTelaCheia() {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch (e) { console.warn('Tela cheia indisponível neste navegador:', e.message); }
}
document.addEventListener('fullscreenchange', () => {
  const b = document.getElementById('cheia');
  if (b) b.textContent = document.fullscreenElement ? 'Sair' : 'Tela cheia';
  if (!document.fullscreenElement) {
    clearTimeout(tempoPonteiro);
    document.querySelector('.palco')?.classList.remove('sem-ponteiro');
  } else esconderPonteiroDepois();
  ajustarEscala();
  if (FECH) desenharCurva(FECH.fechamento[COMP]);
});
let tempoPonteiro;
function esconderPonteiroDepois() {
  clearTimeout(tempoPonteiro);
  const palco = document.querySelector('.palco');
  if (!palco) return;
  palco.classList.remove('sem-ponteiro');
  if (!document.fullscreenElement) return;
  tempoPonteiro = setTimeout(() => palco.classList.add('sem-ponteiro'), 3000);
}
document.addEventListener('mousemove', esconderPonteiroDepois);
document.addEventListener('keydown', ev => {
  if (ev.ctrlKey || ev.altKey || ev.metaKey) return;
  if (ev.key.toLowerCase() === 'f') { ev.preventDefault(); alternarTelaCheia(); }
  else if (ev.key === 'ArrowLeft') { const c = compVizinha(COMP, -1); if (c) { COMP = c; desenhar(); } }
  else if (ev.key === 'ArrowRight') { const c = compVizinha(COMP, 1); if (c) { COMP = c; desenhar(); } }
});

let t;
window.addEventListener('resize', () => {
  ajustarEscala();
  clearTimeout(t);
  t = setTimeout(() => { if (FECH) desenharCurva(FECH.fechamento[COMP]); }, 150);
});
ajustarEscala();
carregar();
</script>
</body>
</html>
