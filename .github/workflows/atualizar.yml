name: Atualizar painel

on:
  schedule:
    # De hora em hora, todos os dias - mesmo esquema do painel comercial,
    # que roda de 15 em 15 min e cujo agendamento funciona. Simples de
    # proposito: restringir dia e faixa de hora e mais uma coisa que pode
    # estar errada quando o painel aparecer parado.
    # Minuto 17 e nao 0: o GitHub enfileira e atrasa o minuto cheio.
    - cron: '17 * * * *'
  workflow_dispatch:        # permite rodar na mao pelo botao do GitHub

permissions:
  contents: write

concurrency:
  group: atualizar-painel
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # guarda a resposta crua da API entre as rodadas: e o que permite baixar
      # so o que mudou (5 min) em vez do ano inteiro (60 min)
      - name: Recuperar coleta anterior
        uses: actions/cache@v4
        with:
          path: dados
          key: acessorias-bruto-${{ github.run_id }}
          restore-keys: acessorias-bruto-

      - name: Baixar do Acessorias
        env:
          ACESSORIAS_TOKEN: ${{ secrets.ACESSORIAS_TOKEN }}
        run: python coletar.py --rapido

      - name: Calcular indicadores
        run: python processar.py

      - name: Publicar
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Rodando de hora em hora, quase toda rodada encontra os mesmos
          # numeros. Nesse caso publica so o pulso (200 bytes) e devolve os
          # arquivos grandes ao que estavam: sem isso seriam 14 commits de
          # 1,7 MB por dia so para mudar o horario dentro do arquivo.
          if git diff --quiet -- data/pulso.json; then
            echo "Nem o pulso mudou (rodada repetida). Nada a publicar."
            exit 0
          fi
          NOVA=$(python -c "import json;print(json.load(open('data/pulso.json'))['digital'])")
          VELHA=$(git show HEAD:data/pulso.json 2>/dev/null | python -c "import json,sys;print(json.load(sys.stdin)['digital'])" 2>/dev/null || echo "sem")
          if [ "$NOVA" = "$VELHA" ]; then
            echo "Os numeros nao mudaram ($NOVA). Publicando so o pulso."
            git checkout -- data/fechamento.json data/operacional.json data/historico.json 2>/dev/null || true
            git add data/pulso.json
            git commit -m "dados: verificado, numeros iguais [skip ci]"
          else
            echo "Numeros mudaram: $VELHA -> $NOVA"
            git add data/
            git commit -m "dados: atualiza o painel [skip ci]"
          fi

          # Se alguem publicou no repositorio enquanto a coleta rodava (leva
          # de 8 a 50 minutos), o push e recusado e a rodada inteira se perde.
          # Nesse caso: joga fora este commit de dados, pega o codigo novo e
          # RECALCULA por cima dele. Os arquivos de data/ sao 100% derivados de
          # dados/bruto.json, que continua no disco do runner - nada se perde,
          # e o resultado passa a valer para a versao mais nova do codigo.
          for tentativa in 1 2 3; do
            if git push; then
              echo "Publicado na tentativa $tentativa."
              exit 0
            fi
            echo "Push recusado: o repositorio andou. Recalculando por cima."
            git fetch origin main
            git reset --hard origin/main
            python processar.py
            git add data/
            if git diff --staged --quiet; then
              echo "Depois de recalcular, os dados ja estavam publicados."
              exit 0
            fi
            git commit -m "dados: atualiza o painel [skip ci]"
          done
          echo "Nao consegui publicar depois de 3 tentativas."
          exit 1
