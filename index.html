<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Fechamento Contábil · LaraFy</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<header>
  <div class="brand">
    <span class="brand-name">Lara<i>Fy</i></span>
    <nav class="nav">
      <a href="painel.html">Painel</a>
      <a href="index.html" class="on">Fechamento contábil</a>
      <a href="operacional.html">Todas as obrigações</a>
    </nav>
  </div>
  <div class="head-right">
    <div class="pill"><span class="pill-lbl">Empresas</span><span class="pill-val" id="pill-emp">--</span></div>
    <div class="pill"><span class="pill-lbl">Atualizado</span><span class="pill-val" id="pill-upd">--</span></div>
    <button class="btn-print" onclick="window.print()">Imprimir / PDF</button>
  </div>
</header>

<div class="filters">
  <span class="filter-label">Competência</span>
  <div class="comp-list" id="comps"></div>
</div>

<main id="app">
  <div class="loading">Carregando dados do Acessórias…</div>
</main>

<footer>LaraFy · dados lidos direto do Acessórias pela API oficial</footer>

<div class="tip" id="tip"></div>

<script src="comum.js"></script>
<script>
// Slots da paleta da marca, ja validados para daltonismo e contraste.
// A serie usa o azul-petroleo #0090B3, nao o cyan da marca: o cyan e
// marca-texto, some numa linha de 2px.
// Semáforo e séries saem dos tokens do pacote visual: o semáforo é
// separado da paleta de gráfico de propósito, e vem sempre com a palavra
// junto na tela, nunca só a cor.
const css = getComputedStyle(document.documentElement);
const tk = n => css.getPropertyValue(n).trim();
const COR = { ok: tk('--ok'), wait: tk('--al'), late: tk('--mal'),
              off: tk('--sOut'), atual: tk('--s1'),
              ant: tk('--sOut') };
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESES_LONGO = { jan:'janeiro', fev:'fevereiro', mar:'março', abr:'abril',
                      mai:'maio', jun:'junho', jul:'julho', ago:'agosto',
                      set:'setembro', out:'outubro', nov:'novembro', dez:'dezembro' };

let DADOS = null, COMP = null, filtroStatus = 'todos', busca = '';

/* ------------------------------------------------------------ utilidades */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const nfmt = n => Number(n || 0).toLocaleString('pt-BR');
const pctTxt = n => Number(n || 0).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%';

function dataBR(iso) {
  if (!iso) return '—';
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[3]}/${m[2]}` : iso;
}
function dataBRcompleta(iso) {
  if (!iso) return '—';
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[3]}/${m[2]}/${m[1]}` : iso;
}
function compLongo(c) {
  const m = String(c || '').match(/([a-z]{3})\/(\d{2})/);
  return m ? `${MESES_LONGO[m[1]]} de 20${m[2]}` : c;
}
function ordemComp(c) {
  const m = String(c || '').match(/([a-z]{3})\/(\d{2})/);
  return m ? parseInt(m[2]) * 100 + MESES.indexOf(m[1]) + 1 : 0;
}
function compAnterior(c) {
  const lista = DADOS.competencias.slice().sort((a, b) => ordemComp(a) - ordemComp(b));
  const i = lista.indexOf(c);
  return i > 0 ? lista[i - 1] : null;
}
function statusTag(sem, txt) {
  const cls = sem === 'green' ? 'ok' : sem === 'red_done' ? 'ok'
            : sem === 'red' ? 'late' : sem === 'gray' ? 'off' : 'wait';
  return `<span class="tag ${cls}">${esc(txt)}</span>`;
}

/* --------------------------------------------------------------- tooltip */
function mostrarTip(ev, html) {
  const t = $('tip');
  t.innerHTML = html;
  t.style.opacity = '1';
  t.style.left = (ev.pageX) + 'px';
  t.style.top = (ev.pageY - 12) + 'px';
}
function esconderTip() { $('tip').style.opacity = '0'; }

/* ------------------------------------------------------------ carregamento */
async function carregar() {
  try {
    const r = await fetch('data/fechamento.json?ts=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    DADOS = await r.json();
  } catch (e) {
    $('app').innerHTML = `<div class="erro"><b>Não consegui ler os dados.</b><br>
      Rode <code>py coletar.py</code> e depois <code>py processar.py</code>,
      e abra o painel por <code>py servir.py</code> (não direto pelo arquivo).<br>
      <span class="muted">Detalhe técnico: ${esc(e.message)}</span></div>`;
    return;
  }
  COMP = DADOS.competencia_foco || DADOS.competencias[0];
  $('pill-emp').textContent = nfmt(DADOS.meta.total_empresas);
  $('pill-upd').textContent = new Date(DADOS.meta.atualizado_em)
    .toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  montarCompetencias();
  render();
}

function montarCompetencias() {
  $('comps').innerHTML = DADOS.competencias.map(c =>
    `<button class="comp${c === COMP ? ' on' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  $('comps').querySelectorAll('.comp').forEach(b => b.onclick = () => {
    COMP = b.dataset.c; filtroStatus = 'todos'; busca = '';
    montarCompetencias(); render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

/* -------------------------------------------------------------- render */
function render() {
  const b = DADOS.fechamento[COMP];
  if (!b) { $('app').innerHTML = '<div class="loading">Sem tarefa de fechamento nesta competência.</div>'; return; }

  $('app').innerHTML = `
    ${avisosHTML(b)}
    <section class="top">
      ${heroHTML(b)}
      <div style="display:grid;gap:18px;align-content:start">
        ${tilesHTML(b)}
        ${apoioHTML(b)}
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <div>
          <div class="card-title">Evolução do fechamento</div>
          <div class="card-sub">Quantas empresas já estavam fechadas a cada dia, em % do total de ${nfmt(b.total)}.</div>
        </div>
        <div class="legend" id="legenda-evolucao"></div>
      </div>
      <div class="card-body"><div class="chart-wrap" id="chart-evolucao"></div></div>
    </section>

    <section class="split-2">
      <div class="card">
        <div class="card-head">
          <div>
            <div class="card-title">Por responsável</div>
            <div class="card-sub">Concluídas, pendentes e atrasadas de cada pessoa.</div>
          </div>
          <div class="legend">
            <span class="legend-item"><span class="legend-swatch" style="background:${COR.ok};height:10px;width:10px;border-radius:3px"></span>Concluída</span>
            <span class="legend-item"><span class="legend-swatch" style="background:${COR.wait};height:10px;width:10px;border-radius:3px"></span>Pendente</span>
            <span class="legend-item"><span class="legend-swatch" style="background:${COR.late};height:10px;width:10px;border-radius:3px"></span>Atrasada</span>
          </div>
        </div>
        <div class="card-body"><div class="bars" id="bars-resp"></div></div>
      </div>

      <div class="card">
        <div class="card-head">
          <div>
            <div class="card-title">Por regime</div>
            <div class="card-sub">% concluído em cada regime tributário.</div>
          </div>
        </div>
        <div class="card-body"><div class="bars" id="bars-regime"></div></div>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <div>
          <div class="card-title">Empresas · ${esc(compLongo(COMP))}</div>
          <div class="card-sub" id="tbl-conta"></div>
        </div>
        <div class="tbl-tools">
          <input class="inp" id="busca" placeholder="Buscar empresa, CNPJ ou responsável…" value="${esc(busca)}">
          <div class="chips" id="chips"></div>
          <button class="chip" id="btn-csv">Baixar Excel</button>
        </div>
      </div>
      <div class="card-body" style="padding-top:0">
        <div class="tbl-scroll"><table>
          <thead><tr>
            <th>Empresa</th><th>UF</th><th>Regime</th><th>Responsável</th>
            <th>Status</th><th class="num">Prazo</th><th class="num">Entrega</th><th class="num">Atraso</th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table></div>
      </div>
    </section>
  `;

  desenharEvolucao(b);
  desenharResponsaveis(b);
  desenharRegimes(b);
  montarTabela(b);
}

/* ---------------------------------------------------------------- avisos
   Duas coisas que fariam o número ser lido errado se ficassem escondidas:
   competência com base menor (não dá para comparar com o mês atual) e
   empresa ativa sem a tarefa cadastrada (o painel não enxerga). */
function avisosHTML(b) {
  const linhas = [];
  const velho = frateDadosVelhos(DADOS.meta);
  if (velho) linhas.push(`<div class="aviso-linha"><b>${esc(velho)}</b></div>`);
  const foco = DADOS.fechamento[DADOS.competencia_foco];
  if (foco && b.total < foco.total * 0.75) {
    linhas.push(`<div class="aviso-linha">Nesta competência apenas
      <b>${nfmt(b.total)}</b> empresas tinham a tarefa de fechamento cadastrada —
      hoje são <b>${nfmt(foco.total)}</b>. O percentual é real, mas
      <b>não dá para comparar com os meses recentes</b>: mudou a base, não o desempenho.</div>`);
  }
  if (b.sem_tarefa) {
    linhas.push(`<div class="aviso-linha"><b>${nfmt(b.sem_tarefa)}</b> empresas ativas
      não têm nenhuma tarefa de fechamento nesta competência — nem dispensada.
      Elas ficam de fora do total. Veja quais no filtro
      <b>"Sem tarefa"</b> da tabela abaixo.</div>`);
  }
  if (!linhas.length) return '';
  return `<div class="aviso"><span class="aviso-icone">!</span><div>${linhas.join('')}</div></div>`;
}

/* ----------------------------------------------------------------- hero */
function heroHTML(b) {
  // Sem rosca: um número grande e uma barra reta dizem o mesmo sem obrigar
  // ninguém a comparar ângulos. A cor só julga depois que o prazo vence —
  // antes disso, um mês recém-aberto apareceria vermelho sem estar atrasado.
  const hoje = new Date().toISOString().slice(0, 10);
  const venceu = b.prazo_legal && b.prazo_legal < hoje;
  const p = Math.max(0, Math.min(100, b.percentual));
  const cor = !venceu ? 'var(--s1)'
            : p >= 95 ? 'var(--ok)' : p >= 80 ? 'var(--al)' : 'var(--mal)';
  const w = n => b.total ? (n / b.total) * 100 : 0;
  return `
  <div class="card hero">
    <div class="hero-cap">Fechamento concluído</div>
    <div class="hero-num" style="color:${cor}">${pctTxt(b.percentual)}</div>
    <div class="hero-barra">
      ${b.concluidas ? `<i style="width:${w(b.concluidas)}%;background:${cor}"></i>` : ''}
      ${b.atrasadas ? `<i style="width:${w(b.atrasadas)}%;background:var(--mal)"></i>` : ''}
      ${b.pendentes ? `<i style="width:${w(b.pendentes)}%;background:var(--al)"></i>` : ''}
    </div>
    <div class="hero-count"><b>${nfmt(b.concluidas)}</b> de <b>${nfmt(b.total)}</b> empresas fechadas</div>
    <div class="hero-prazo">
      ${b.prazo_legal ? (venceu ? 'Prazo venceu em ' : 'Prazo: ') + dataBRcompleta(b.prazo_legal) : ''}
      ${b.dispensadas ? ' · ' + nfmt(b.dispensadas) + ' dispensadas, fora do total' : ''}
    </div>
    ${comparativoHTML(b)}
  </div>`;
}

/* Compara com o mes anterior NO MESMO DIA do ciclo - a unica comparacao justa
   enquanto o mes corre. "58% no mes passado" nao serve de alvo se aquilo foi
   o resultado do mes inteiro. */
function comparativoHTML(b) {
  const anterior = compAnterior(COMP), bAnt = anterior ? DADOS.fechamento[anterior] : null;
  if (!bAnt || !b.abre_em || !bAnt.abre_em) return '';
  const diaCiclo = Math.floor((new Date() - new Date(b.abre_em + 'T00:00:00')) / 86400000);
  if (diaCiclo < 0) return '';
  const alvoDia = new Date(new Date(bAnt.abre_em + 'T00:00:00').getTime() + diaCiclo * 86400000)
    .toISOString().slice(0, 10);
  const ate = bAnt.curva.filter(p => p.dia <= alvoDia);
  const ref = ate.length ? ate[ate.length - 1].percentual : 0;
  const dif = b.percentual - ref;
  const cor = dif >= 0 ? 'var(--ok)' : 'var(--mal)';
  const seta = dif >= 0 ? '▲' : '▼';
  return `<div class="hero-prazo" style="margin-top:9px;padding-top:9px;border-top:1px solid var(--border)">
    No mesmo ponto do mês, ${esc(anterior)} tinha <b>${pctTxt(ref)}</b><br>
    <span style="color:${cor};font-weight:600">${seta} ${pctTxt(Math.abs(dif))}</span>
    ${dif >= 0 ? 'à frente' : 'atrás'} do ritmo do mês anterior</div>`;
}

/* ---------------------------------------------------------------- tiles */
function tilesHTML(b) {
  const t = (cor, lbl, val, sub, pctBar) => `
    <div class="tile">
      <div class="tile-top"><span class="dot" style="background:${cor}"></span>
        <span class="tile-lbl">${lbl}</span></div>
      <div class="tile-val">${nfmt(val)}</div>
      <div class="tile-sub">${sub}</div>
      <div class="tile-bar"><i style="width:${Math.min(100, pctBar)}%;background:${cor}"></i></div>
    </div>`;
  return `<div class="tiles">
    ${t(COR.ok, 'Concluídas', b.concluidas,
        `${nfmt(b.concluidas_no_prazo)} no prazo · ${nfmt(b.concluidas_atrasadas)} em atraso`, b.percentual)}
    ${t(COR.wait, 'Pendentes', b.pendentes, `${pctTxt(b.percentual_pendentes)} do total`, b.percentual_pendentes)}
    ${t(COR.late, 'Atrasadas', b.atrasadas, `${pctTxt(b.percentual_atrasadas)} do total`, b.percentual_atrasadas)}
    ${t(COR.off, 'Dispensadas', b.dispensadas,
        `fora da conta, não entram no total`, b.total ? (b.dispensadas / (b.total + b.dispensadas)) * 100 : 0)}
  </div>`;
}

function apoioHTML(b) {
  const it = Object.values(b.apoio || {});
  if (!it.length) return '';
  return `<div class="card">
    <div class="card-head"><div>
      <div class="card-title">Etapas de apoio</div>
      <div class="card-sub">Tarefas que caminham junto com o fechamento, na mesma competência.</div>
    </div></div>
    <div class="card-body"><div class="bars">
      ${it.map(a => `
        <div class="bar-row">
          <div class="bar-name" title="${esc(a.nome)}">${esc(a.nome)}</div>
          <div class="bar-track"><i style="width:${a.percentual}%;background:${COR.ok}"></i></div>
          <div class="bar-val"><b>${pctTxt(a.percentual)}</b> · ${nfmt(a.concluidas)}/${nfmt(a.total)}</div>
        </div>`).join('')}
    </div></div>
  </div>`;
}

/* ----------------------------------------------------- gráfico evolução */
function desenharEvolucao(b) {
  const box = $('chart-evolucao');
  const anterior = compAnterior(COMP);
  const bAnt = anterior ? DADOS.fechamento[anterior] : null;

  // Eixo x = dias desde a ABERTURA da competência (o 1º prazo técnico), não desde
  // a primeira entrega. É o que deixa dois meses comparáveis: dia 10 de julho e
  // dia 10 de junho são o mesmo ponto do ciclo de trabalho.
  const serie = (bloco) => {
    if (!bloco || !bloco.curva.length) return [];
    const base = bloco.abre_em || bloco.curva[0].dia;
    const t0 = new Date(base + 'T00:00:00');
    return bloco.curva.map(p => ({
      x: Math.round((new Date(p.dia + 'T00:00:00') - t0) / 86400000),
      y: p.percentual, dia: p.dia, ac: p.acumulado, no_dia: p.no_dia
    }));
  };
  const sA = serie(b), sB = serie(bAnt);
  const diaHoje = b.abre_em
    ? Math.floor((new Date() - new Date(b.abre_em + 'T00:00:00')) / 86400000) : null;
  const diaPrazo = (b.abre_em && b.prazo_legal)
    ? Math.round((new Date(b.prazo_legal + 'T00:00:00') - new Date(b.abre_em + 'T00:00:00')) / 86400000)
    : null;
  if (!sA.length && !sB.length) {
    box.innerHTML = '<div class="loading">Nenhuma empresa fechada ainda nesta competência.</div>';
    $('legenda-evolucao').innerHTML = '';
    return;
  }

  $('legenda-evolucao').innerHTML = `
    <span class="legend-item"><span class="legend-swatch" style="background:${COR.atual}"></span>${esc(COMP)}</span>
    ${bAnt ? `<span class="legend-item"><span class="legend-swatch" style="background:${COR.ant}"></span>${esc(anterior)} (referência)</span>` : ''}`;

  const W = box.clientWidth || 900, H = 300;
  const M = { t: 14, r: 54, b: 30, l: 40 };
  const maxX = Math.max(1, ...sA.map(p => p.x), ...sB.map(p => p.x),
                        diaPrazo || 0, diaHoje != null ? diaHoje : 0);
  const minX = Math.min(0, ...sA.map(p => p.x), ...sB.map(p => p.x));
  const maxY = Math.max(20, Math.ceil(Math.max(...sA.map(p => p.y), ...sB.map(p => p.y), 0) / 10) * 10);
  const px = x => M.l + ((x - minX) / (maxX - minX)) * (W - M.l - M.r);
  const py = y => H - M.b - (y / maxY) * (H - M.t - M.b);
  const linha = s => s.map((p, i) => (i ? 'L' : 'M') + px(p.x).toFixed(1) + ' ' + py(p.y).toFixed(1)).join(' ');

  const ticksY = [];
  for (let v = 0; v <= maxY; v += (maxY <= 40 ? 10 : 20)) ticksY.push(v);
  const passo = maxX <= 14 ? 2 : maxX <= 40 ? 7 : 14;
  const ticksX = [];
  for (let v = 0; v <= maxX; v += passo) ticksX.push(v);

  const rotulo = (s, cor) => {
    if (!s.length) return '';
    const u = s[s.length - 1];
    return `<circle cx="${px(u.x)}" cy="${py(u.y)}" r="4.5" fill="${cor}" stroke="#fff" stroke-width="2"/>
      <text x="${px(u.x) + 9}" y="${py(u.y) + 4}" class="axis-txt b" fill="${cor}">${pctTxt(u.y)}</text>`;
  };

  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="height:${H}px" id="svg-evo">
    ${ticksY.map(v => `<line class="grid-line" x1="${M.l}" x2="${W - M.r}" y1="${py(v)}" y2="${py(v)}"/>
      <text class="axis-txt" x="${M.l - 8}" y="${py(v) + 4}" text-anchor="end">${v}%</text>`).join('')}
    ${ticksX.map(v => `<text class="axis-txt" x="${px(v)}" y="${H - M.b + 17}" text-anchor="middle">${v === 0 ? 'abertura' : 'dia ' + v}</text>`).join('')}
    ${diaPrazo != null && diaPrazo <= maxX ? `
      <line x1="${px(diaPrazo)}" x2="${px(diaPrazo)}" y1="${M.t}" y2="${H - M.b}"
            stroke="${COR.late}" stroke-width="1.5" stroke-dasharray="3 3" opacity=".55"/>
      <text class="axis-txt" x="${px(diaPrazo)}" y="${M.t - 3}" text-anchor="middle"
            fill="${COR.late}" font-weight="600">prazo</text>` : ''}
    ${diaHoje != null && diaHoje >= 0 && diaHoje <= maxX ? `
      <line x1="${px(diaHoje)}" x2="${px(diaHoje)}" y1="${M.t}" y2="${H - M.b}"
            stroke="var(--tin)" stroke-width="1.5" opacity=".35"/>
      <text class="axis-txt b" x="${px(diaHoje)}" y="${M.t - 3}" text-anchor="middle">hoje</text>` : ''}
    ${sB.length ? `<path d="${linha(sB)}" fill="none" stroke="${COR.ant}" stroke-width="2"
        stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
    ${sA.length ? `<path d="${linha(sA)}" fill="none" stroke="${COR.atual}" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>` : ''}
    ${rotulo(sB, COR.ant)}
    ${rotulo(sA, COR.atual)}
    <line id="cross" x1="0" x2="0" y1="${M.t}" y2="${H - M.b}" stroke="${COR.atual}"
          stroke-width="1" opacity="0"/>
    <rect id="hit" x="${M.l}" y="${M.t}" width="${W - M.l - M.r}" height="${H - M.t - M.b}" fill="transparent"/>
  </svg>`;

  const svg = $('svg-evo'), cross = $('cross');
  const maisPerto = (s, x) => s.reduce((a, p) => Math.abs(p.x - x) < Math.abs(a.x - x) ? p : a, s[0]);
  $('hit').addEventListener('mousemove', ev => {
    const r = svg.getBoundingClientRect();
    const escala = W / r.width;
    const xSvg = (ev.clientX - r.left) * escala;
    const xVal = Math.round(minX + ((xSvg - M.l) / (W - M.l - M.r)) * (maxX - minX));
    const pA = sA.length ? maisPerto(sA, xVal) : null;
    const pB = sB.length ? maisPerto(sB, xVal) : null;
    if (pA) { cross.setAttribute('x1', px(pA.x)); cross.setAttribute('x2', px(pA.x)); cross.setAttribute('opacity', '.35'); }
    mostrarTip(ev, `<div class="tip-ttl">${pA ? dataBRcompleta(pA.dia) : 'dia ' + xVal}</div>
      ${pA ? `<div class="tip-row"><span class="dot" style="background:${COR.atual}"></span>
        ${esc(COMP)}: <b>${pctTxt(pA.y)}</b> · ${nfmt(pA.ac)} empresas</div>` : ''}
      ${pB ? `<div class="tip-row"><span class="dot" style="background:${COR.ant}"></span>
        ${esc(anterior)}: <b>${pctTxt(pB.y)}</b> · ${nfmt(pB.ac)} empresas</div>` : ''}`);
  });
  $('hit').addEventListener('mouseleave', () => { cross.setAttribute('opacity', '0'); esconderTip(); });
}

/* ------------------------------------------------------ barras auxiliares */
function desenharResponsaveis(b) {
  const lista = b.por_responsavel.slice(0, 16);
  $('bars-resp').innerHTML = lista.map(r => {
    const w = t => (r.total ? (t / r.total) * 100 : 0);
    return `<div class="bar-row" data-nome="${esc(r.nome)}">
      <div class="bar-name" title="${esc(r.nome)}">${esc(r.nome)}</div>
      <div class="bar-track">
        ${r.concluidas ? `<i style="width:${w(r.concluidas)}%;background:${COR.ok}"></i>` : ''}
        ${r.pendentes ? `<i style="width:${w(r.pendentes)}%;background:${COR.wait}"></i>` : ''}
        ${r.atrasadas ? `<i style="width:${w(r.atrasadas)}%;background:${COR.late}"></i>` : ''}
      </div>
      <div class="bar-val"><b>${pctTxt(r.percentual)}</b> · ${nfmt(r.concluidas)}/${nfmt(r.total)}</div>
    </div>`;
  }).join('');

  $('bars-resp').querySelectorAll('.bar-row').forEach(row => {
    const r = lista.find(x => x.nome === row.dataset.nome);
    row.addEventListener('mousemove', ev => mostrarTip(ev, `<div class="tip-ttl">${esc(r.nome)}</div>
      <div class="tip-row"><span class="dot" style="background:${COR.ok}"></span>Concluídas: <b>${nfmt(r.concluidas)}</b></div>
      <div class="tip-row"><span class="dot" style="background:${COR.wait}"></span>Pendentes: <b>${nfmt(r.pendentes)}</b></div>
      <div class="tip-row"><span class="dot" style="background:${COR.late}"></span>Atrasadas: <b>${nfmt(r.atrasadas)}</b></div>`));
    row.addEventListener('mouseleave', esconderTip);
    row.style.cursor = 'pointer';
    row.addEventListener('click', () => {
      busca = r.nome; $('busca').value = r.nome; montarTabela(b);
      document.querySelector('.tbl-scroll').scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  });
}

function desenharRegimes(b) {
  $('bars-regime').innerHTML = b.por_regime.map(r => `
    <div class="bar-row" style="grid-template-columns:112px 1fr 92px">
      <div class="bar-name">${esc(r.regime)}</div>
      <div class="bar-track"><i style="width:${r.percentual}%;background:${COR.ok}"></i></div>
      <div class="bar-val"><b>${pctTxt(r.percentual)}</b> · ${nfmt(r.concluidas)}/${nfmt(r.total)}</div>
    </div>`).join('');
}

/* --------------------------------------------------------------- tabela */
function montarTabela(b) {
  const chips = [
    ['todos', 'Todas'], ['pendente', 'Pendentes'], ['atrasada', 'Atrasadas'], ['concluida', 'Concluídas'],
  ];
  if (b.sem_tarefa) chips.push(['sem_tarefa', `Sem tarefa (${nfmt(b.sem_tarefa)})`]);
  $('chips').innerHTML = chips.map(([k, l]) =>
    `<button class="chip${filtroStatus === k ? ' on' : ''}" data-k="${k}">${l}</button>`).join('');
  $('chips').querySelectorAll('.chip').forEach(c => c.onclick = () => {
    filtroStatus = c.dataset.k; montarTabela(b);
  });
  $('busca').oninput = e => { busca = e.target.value; montarTabela(b); };
  $('btn-csv').onclick = () => baixarCSV(filtrar(b));

  const linhas = filtrar(b);
  $('tbl-conta').textContent = filtroStatus === 'sem_tarefa'
    ? `${nfmt(linhas.length)} empresas ativas sem tarefa de fechamento nesta competência`
    : `${nfmt(linhas.length)} de ${nfmt(b.empresas.length)} empresas · clique numa pessoa no gráfico ao lado para filtrar`;

  $('tbody').innerHTML = linhas.map(e => `
    <tr>
      <td><b>${esc(e.empresa)}</b><br><span class="muted" style="font-size:11.5px">${esc(cnpjFmt(e.cnpj))}</span></td>
      <td class="muted">${esc(e.uf || '—')}</td>
      <td class="muted">${esc(e.regime)}</td>
      <td>${esc(e.responsavel || '—')}</td>
      <td>${statusTag(e.semaforo, e.status || '—')}</td>
      <td class="num muted">${dataBR(e.prazo)}</td>
      <td class="num">${e.entrega ? dataBR(e.entrega) : '<span class="muted">—</span>'}</td>
      <td class="num">${e.dias_atraso ? `<b style="color:${COR.late}">${nfmt(e.dias_atraso)}d</b>` : '<span class="muted">—</span>'}</td>
    </tr>`).join('') || '<tr><td colspan="8" class="muted" style="padding:26px;text-align:center">Nada encontrado.</td></tr>';
}

function filtrar(b) {
  const q = busca.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const base = filtroStatus === 'sem_tarefa'
    ? (b.sem_tarefa_lista || []).map(e => ({
        ...e, obrigacao: '', status: 'Sem tarefa cadastrada', semaforo: 'gray',
        entregue: false, responsavel: '', prazo: '', entrega: '', dias_atraso: 0
      }))
    : b.empresas;
  return base.filter(e => {
    if (filtroStatus === 'sem_tarefa') { /* lista propria, sem filtro de status */ }
    else if (filtroStatus === 'concluida' && !e.entregue) return false;
    if (filtroStatus === 'pendente' && !(e.semaforo === 'amber')) return false;
    if (filtroStatus === 'atrasada' && !(e.semaforo === 'red')) return false;
    if (!q) return true;
    const alvo = (e.empresa + ' ' + e.cnpj + ' ' + e.responsavel + ' ' + e.regime)
      .toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    return alvo.includes(q);
  });
}

function cnpjFmt(c) {
  const d = String(c || '').padStart(14, '0');
  return d.length === 14
    ? `${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5,8)}/${d.slice(8,12)}-${d.slice(12)}` : c;
}

function baixarCSV(linhas) {
  const cab = ['Empresa', 'CNPJ', 'UF', 'Regime', 'Responsavel', 'Status', 'Prazo', 'Entrega', 'DiasAtraso'];
  const corpo = linhas.map(e => [e.empresa, cnpjFmt(e.cnpj), e.uf, e.regime, e.responsavel,
    e.status, dataBRcompleta(e.prazo), e.entrega ? dataBRcompleta(e.entrega) : '', e.dias_atraso]);
  const csv = '﻿' + [cab, ...corpo]
    .map(l => l.map(c => `"${String(c == null ? '' : c).replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `fechamento-contabil-${COMP.replace('/', '-')}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

window.addEventListener('resize', () => {
  if (DADOS && DADOS.fechamento[COMP]) desenharEvolucao(DADOS.fechamento[COMP]);
});
carregar();
</script>
